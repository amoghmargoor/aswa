# ASWA Pre-commit Configuration
# See https://pre-commit.com for more information

default_language_version:
  python: python3.11

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        exclude: '^infrastructure/helm/'
      - id: check-json
        name: Check JSON syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: mixed-line-ending
        name: Check line endings
        args: ['--fix=lf']

  # Python: Black formatter
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        name: Format Python code with Black
        language_version: python3.11
        args: ['--line-length=100']
        files: '^(libs/common-python|services/(ingestion-service|insight-engine|query-service|slack-bot)|workers/).*\.py$'

  # Python: Ruff linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        name: Lint Python code with Ruff
        args: ['--fix', '--exit-non-zero-on-fix']
        files: '^(libs/common-python|services/(ingestion-service|insight-engine|query-service|slack-bot)|workers/).*\.py$'

  # Python: Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort Python imports
        args: ['--profile=black', '--line-length=100']
        files: '^(libs/common-python|services/(ingestion-service|insight-engine|query-service|slack-bot)|workers/).*\.py$'

  # Python: Type checking (optional, can be slow)
  # Uncomment to enable
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.8.0
  #   hooks:
  #     - id: mypy
  #       name: Type check Python code
  #       additional_dependencies: [types-all]
  #       files: '^(libs/common-python|services/(ingestion-service|insight-engine|query-service|slack-bot)|workers/).*\.py$'

  # Java: Spotless (Google Java Format)
  - repo: local
    hooks:
      - id: spotless-check
        name: Check Java formatting with Spotless
        entry: ./gradlew spotlessCheck
        language: system
        files: '^(libs/common-java|services/(api-gateway|notification-service|integration-service)).*\.java$'
        pass_filenames: false

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ['--fix']
        exclude: '^(node_modules|\.venv|venv)/'

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        name: Lint YAML files
        args: ['-d', '{extends: default, rules: {line-length: {max: 120}, document-start: disable}}']
        exclude: '^infrastructure/helm/'

  # Shell script checking
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        name: Check shell scripts
        files: '\.(sh|bash)$'

  # Docker linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles
        files: 'Dockerfile.*'

# Configuration for specific hooks
ci:
  skip: [spotless-check]  # Skip Gradle tasks in CI pre-commit
