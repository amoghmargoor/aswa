[tool.poetry]
name = "aswa-document-processor"
version = "0.1.0"
description = "ASWA Document Processor Worker - Background document processing"
authors = ["ASWA Team"]
readme = "README.md"
packages = [{ include = "aswa_processor", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
aswa-common = { path = "../../libs/common-python", develop = true }
aswa-ingestion = { path = "../../services/ingestion-service", develop = true }

# Queue & Caching
redis = ">=5.0"

# Workflow Orchestration
prefect = ">=2.14"

# Logging
structlog = ">=24.1"

# Observability
prometheus-client = ">=0.19"

# Settings
pydantic-settings = ">=2.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=4.1"
fakeredis = ">=2.21"

[tool.poetry.scripts]
document-processor = "aswa_processor.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=aswa_processor --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
