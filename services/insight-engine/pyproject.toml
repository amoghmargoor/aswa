[tool.poetry]
name = "aswa-insight-engine"
version = "0.1.0"
description = "ASWA Insight Engine - LLM-powered insight extraction service"
authors = ["ASWA Team"]
readme = "README.md"
packages = [{ include = "aswa_insight", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
aswa-common = { path = "../../libs/common-python", develop = true }

# Web Framework
fastapi = ">=0.109"
uvicorn = { extras = ["standard"], version = ">=0.27" }

# LLM & AI
instructor = ">=1.0"
openai = ">=1.10"
aioboto3 = ">=12.0"

# Data Validation
pydantic = ">=2.6"
pydantic-settings = ">=2.1"

# Logging
structlog = ">=24.1"

# Async
httpx = ">=0.26"
redis = ">=5.0"

# Observability
prometheus-client = ">=0.19"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=4.1"
respx = ">=0.20"
httpx = ">=0.26"

[tool.poetry.scripts]
insight-engine = "aswa_insight.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=aswa_insight --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
