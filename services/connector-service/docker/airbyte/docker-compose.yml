# Airbyte Docker Compose for local development
# Minimal setup - for production use Kubernetes

version: "3.8"

services:
  # Airbyte dependencies
  airbyte-db:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: airbyte
      POSTGRES_PASSWORD: airbyte
      POSTGRES_DB: airbyte
    volumes:
      - airbyte_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbyte"]
      interval: 10s
      timeout: 5s
      retries: 5

  airbyte-temporal:
    image: temporalio/auto-setup:1.13.0
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: airbyte
      POSTGRES_PWD: airbyte
      POSTGRES_SEEDS: airbyte-db
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig/development.yaml
    volumes:
      - ./temporal-dynamicconfig:/etc/temporal/dynamicconfig
    depends_on:
      airbyte-db:
        condition: service_healthy

  # Airbyte services
  airbyte-server:
    image: airbyte/server:${AIRBYTE_VERSION:-0.50.33}
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION:-0.50.33}
      CONFIG_ROOT: /data
      DATABASE_URL: jdbc:postgresql://airbyte-db:5432/airbyte
      DATABASE_USER: airbyte
      DATABASE_PASSWORD: airbyte
      WORKSPACE_ROOT: /tmp/workspace
      TEMPORAL_HOST: airbyte-temporal:7233
      TRACKING_STRATEGY: logging
      LOG_LEVEL: INFO
      JOB_MAIN_CONTAINER_CPU_REQUEST: 0.5
      JOB_MAIN_CONTAINER_CPU_LIMIT: 1
      JOB_MAIN_CONTAINER_MEMORY_REQUEST: 500Mi
      JOB_MAIN_CONTAINER_MEMORY_LIMIT: 1Gi
    volumes:
      - airbyte_workspace:/tmp/workspace
      - airbyte_data:/data
    ports:
      - "8001:8001"
    depends_on:
      airbyte-db:
        condition: service_healthy
      airbyte-temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airbyte-worker:
    image: airbyte/worker:${AIRBYTE_VERSION:-0.50.33}
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION:-0.50.33}
      CONFIG_ROOT: /data
      DATABASE_URL: jdbc:postgresql://airbyte-db:5432/airbyte
      DATABASE_USER: airbyte
      DATABASE_PASSWORD: airbyte
      WORKSPACE_ROOT: /tmp/workspace
      TEMPORAL_HOST: airbyte-temporal:7233
      LOG_LEVEL: INFO
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - airbyte_workspace:/tmp/workspace
      - airbyte_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airbyte-server:
        condition: service_healthy

  # Optional: Airbyte webapp for debugging
  airbyte-webapp:
    image: airbyte/webapp:${AIRBYTE_VERSION:-0.50.33}
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION:-0.50.33}
      API_URL: /api/v1/
      INTERNAL_API_HOST: airbyte-server:8001
    ports:
      - "8000:80"
    depends_on:
      airbyte-server:
        condition: service_healthy
    profiles:
      - webapp

volumes:
  airbyte_db_data:
  airbyte_workspace:
  airbyte_data:
