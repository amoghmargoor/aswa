[tool.poetry]
name = "aswa-connector"
version = "0.1.0"
description = "ASWA Connector Service - Data source connectors with Airbyte integration"
authors = ["ASWA Team"]
readme = "README.md"
packages = [{ include = "aswa_connector", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
aswa-common = { path = "../../libs/common-python", develop = true }

# Web Framework
fastapi = ">=0.109"
uvicorn = { extras = ["standard"], version = ">=0.27" }

# Async HTTP
httpx = ">=0.26"
aiofiles = ">=23.2"

# Database & Cache
redis = ">=5.0"

# OAuth
authlib = ">=1.3"
cryptography = ">=42.0"

# Airbyte
airbyte-api = ">=0.49"

# Scheduling
croniter = ">=2.0"
apscheduler = ">=3.10"

# Observability
prometheus-client = ">=0.19"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=4.1"
httpx = ">=0.26"
fakeredis = ">=2.21"
respx = ">=0.20"

[tool.poetry.scripts]
connector = "aswa_connector.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=aswa_connector --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
