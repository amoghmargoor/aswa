[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aswa-notifications"
version = "0.1.0"
description = "ASWA Notification Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "jinja2>=3.1.0",
    "aiosmtplib>=3.0.0",
    "httpx>=0.25.0",
    "structlog>=23.2.0",
    "celery>=5.3.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
