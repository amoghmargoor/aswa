[tool.poetry]
name = "aswa-agent-service"
version = "0.1.0"
description = "ASWA AI Agent Platform Service"
authors = ["ASWA Team"]
readme = "README.md"
packages = [{ include = "aswa_agents", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
aswa-common = { path = "../../libs/common-python", develop = true }

# Web Framework
fastapi = ">=0.109"
uvicorn = { extras = ["standard"], version = ">=0.27" }

# Data Validation
pydantic = ">=2.6"
pydantic-settings = ">=2.1"

# Database
sqlalchemy = { extras = ["asyncio"], version = ">=2.0" }
asyncpg = ">=0.29"
alembic = ">=1.13"

# Redis
redis = ">=5.0"

# HTTP Client
httpx = ">=0.26"

# Authentication
python-jose = { extras = ["cryptography"], version = ">=3.3" }

# Templating
pyyaml = ">=6.0"
jinja2 = ">=3.1"

# Logging
structlog = ">=24.1"

# Observability
prometheus-client = ">=0.19"
opentelemetry-api = ">=1.22"
opentelemetry-sdk = ">=1.22"
opentelemetry-instrumentation-fastapi = ">=0.43b0"

# LLM SDKs
anthropic = ">=0.18"
openai = ">=1.10"

# Retry logic
tenacity = ">=8.2"

# Scheduling
croniter = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=4.1"
pytest-mock = ">=3.12"
httpx = ">=0.26"
factory-boy = ">=3.3"
fakeredis = ">=2.20"
respx = ">=0.20"

[tool.poetry.scripts]
agent-service = "aswa_agents.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=aswa_agents --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
