name: E2E Tests

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps

      - name: Run E2E tests
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL }}
          API_URL: ${{ vars.E2E_API_URL }}
          TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: |
          npx playwright test --reporter=html,github

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ inputs.environment }}
          path: tests/e2e/playwright-report/
          retention-days: 30

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-videos-${{ inputs.environment }}
          path: tests/e2e/test-results/
          retention-days: 7

  api-e2e:
    name: API E2E Tests
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: tests/api-e2e
        run: |
          pip install -r requirements.txt

      - name: Run API E2E tests
        working-directory: tests/api-e2e
        env:
          API_URL: ${{ vars.E2E_API_URL }}
          API_TOKEN: ${{ secrets.E2E_API_TOKEN }}
        run: |
          pytest tests/ -v --html=report.html --self-contained-html

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-e2e-report-${{ inputs.environment }}
          path: tests/api-e2e/report.html
          retention-days: 30
