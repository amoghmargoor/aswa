name: Test

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  test-java:
    name: Test Java
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aswa
          POSTGRES_PASSWORD: aswa
          POSTGRES_DB: aswa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build common-java
        working-directory: libs/common-java
        run: ./gradlew build publishToMavenLocal

      - name: Test API Gateway
        working-directory: services/api-gateway
        env:
          DATABASE_URL: postgresql://aswa:aswa@localhost:5432/aswa_test
          REDIS_URL: redis://localhost:6379
        run: |
          ./gradlew test jacocoTestReport

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/api-gateway/build/reports/jacoco/test/jacocoTestReport.xml
          flags: java
          fail_ci_if_error: false

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ingestion-service
          - query-service
          - insight-service
      fail-fast: false
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aswa
          POSTGRES_PASSWORD: aswa
          POSTGRES_DB: aswa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          pip install -e ../../libs/common-python
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          DATABASE_URL: postgresql://aswa:aswa@localhost:5432/aswa_test
          REDIS_URL: redis://localhost:6379
          ELASTICSEARCH_URL: http://localhost:9200
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/${{ matrix.service }}/coverage.xml
          flags: python,${{ matrix.service }}
          fail_ci_if_error: false

  test-web:
    name: Test Web Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/web-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: services/web-dashboard
        run: npm ci

      - name: Run tests
        working-directory: services/web-dashboard
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/web-dashboard/coverage/lcov.info
          flags: typescript,web
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-java, test-python]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aswa
          POSTGRES_PASSWORD: aswa
          POSTGRES_DB: aswa_test
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

      elasticsearch:
        image: elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
        ports:
          - 9200:9200

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Start services
        run: |
          # Build and start services for integration testing
          docker-compose -f docker-compose.test.yml up -d --build
          sleep 30

      - name: Run integration tests
        run: |
          pip install pytest httpx
          pytest tests/integration/ -v

      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.test.yml down -v
