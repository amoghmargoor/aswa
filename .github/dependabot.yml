version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/libs/common-python"
    schedule:
      interval: "weekly"
    groups:
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/services/ingestion-service"
    schedule:
      interval: "weekly"
    groups:
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/services/query-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/services/insight-service"
    schedule:
      interval: "weekly"

  # Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/libs/common-java"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"

  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/services/web-dashboard"
    schedule:
      interval: "weekly"
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/ingestion-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/web-dashboard"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
