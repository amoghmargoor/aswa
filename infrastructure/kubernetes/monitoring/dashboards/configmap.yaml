apiVersion: v1
kind: ConfigMap
metadata:
  name: aswa-grafana-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    grafana_dashboard: "1"
data:
  aswa-overview.json: |
    {{ .Files.Get "dashboards/aswa-overview.json" | indent 4 }}

  aswa-business.json: |
    {{ .Files.Get "dashboards/aswa-business.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server:80
        isDefault: true

      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway:80

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://aswa-jaeger-query:16686
