apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insight-ingress
  namespace: aswa-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: insight
  policyTypes:
    - Ingress
  ingress:
    # Allow from API gateway
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api-gateway
      ports:
        - protocol: TCP
          port: 8003
    # Allow from ingestion service
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: ingestion
      ports:
        - protocol: TCP
          port: 8003
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insight-egress
  namespace: aswa-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: insight
  policyTypes:
    - Egress
  egress:
    # Allow to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # Allow external PostgreSQL
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
    # Allow to Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow to Elasticsearch
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: elasticsearch
      ports:
        - protocol: TCP
          port: 9200
