# PostgreSQL network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-ingress
  namespace: aswa-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: postgresql
  policyTypes:
    - Ingress
  ingress:
    # Allow from ASWA services
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aswa
      ports:
        - protocol: TCP
          port: 5432
---
# Redis network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: aswa-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: redis
  policyTypes:
    - Ingress
  ingress:
    # Allow from ASWA services
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aswa
      ports:
        - protocol: TCP
          port: 6379
---
# Elasticsearch network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elasticsearch-ingress
  namespace: aswa-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: elasticsearch
  policyTypes:
    - Ingress
  ingress:
    # Allow from ASWA services
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aswa
      ports:
        - protocol: TCP
          port: 9200
    # Allow internal cluster communication
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: elasticsearch
      ports:
        - protocol: TCP
          port: 9300
