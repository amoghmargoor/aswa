# API Gateway Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aswa-api-gateway
  namespace: aswa-prod
  labels:
    app.kubernetes.io/name: aswa
    app.kubernetes.io/component: api-gateway
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/aswa-api-gateway-role
---
