# Elasticsearch index template for audit logs
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-index-template
  namespace: aswa-production
data:
  template.json: |
    {
      "index_patterns": ["audit-*"],
      "settings": {
        "number_of_shards": 3,
        "number_of_replicas": 2,
        "index.lifecycle.name": "audit-retention",
        "index.lifecycle.rollover_alias": "audit"
      },
      "mappings": {
        "properties": {
          "id": { "type": "keyword" },
          "timestamp": { "type": "date" },
          "tenant_id": { "type": "keyword" },
          "user_id": { "type": "keyword" },
          "user_email": { "type": "keyword" },
          "user_role": { "type": "keyword" },
          "action": { "type": "keyword" },
          "category": { "type": "keyword" },
          "resource_type": { "type": "keyword" },
          "resource_id": { "type": "keyword" },
          "result": { "type": "keyword" },
          "ip_address": { "type": "ip" },
          "user_agent": { "type": "text" },
          "session_id": { "type": "keyword" },
          "trace_id": { "type": "keyword" },
          "metadata": { "type": "object", "enabled": true },
          "before": { "type": "object", "enabled": false },
          "after": { "type": "object", "enabled": false },
          "error_message": { "type": "text" },
          "hash": { "type": "keyword" }
        }
      }
    }
---
# ILM policy for audit log retention
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-ilm-policy
  namespace: aswa-production
data:
  policy.json: |
    {
      "policy": {
        "phases": {
          "hot": {
            "min_age": "0ms",
            "actions": {
              "rollover": {
                "max_size": "50gb",
                "max_age": "1d"
              },
              "set_priority": {
                "priority": 100
              }
            }
          },
          "warm": {
            "min_age": "7d",
            "actions": {
              "shrink": {
                "number_of_shards": 1
              },
              "forcemerge": {
                "max_num_segments": 1
              },
              "set_priority": {
                "priority": 50
              }
            }
          },
          "cold": {
            "min_age": "30d",
            "actions": {
              "freeze": {},
              "set_priority": {
                "priority": 0
              }
            }
          },
          "delete": {
            "min_age": "365d",
            "actions": {
              "delete": {}
            }
          }
        }
      }
    }
