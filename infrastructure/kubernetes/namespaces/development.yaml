apiVersion: v1
kind: Namespace
metadata:
  name: aswa-dev
  labels:
    app.kubernetes.io/name: aswa
    app.kubernetes.io/environment: development
    istio-injection: disabled
  annotations:
    scheduler.alpha.kubernetes.io/defaultTolerations: |
      [{"operator": "Exists", "effect": "NoSchedule", "key": "environment", "value": "development"}]
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aswa-dev-quota
  namespace: aswa-dev
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
    services: "20"
    secrets: "50"
    configmaps: "50"
    persistentvolumeclaims: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: aswa-dev-limits
  namespace: aswa-dev
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
      min:
        cpu: 50m
        memory: 64Mi
      type: Container
    - max:
        storage: 50Gi
      min:
        storage: 1Gi
      type: PersistentVolumeClaim
