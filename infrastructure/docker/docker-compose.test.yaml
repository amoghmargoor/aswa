version: '3.8'

services:
  # Test database
  postgres-test:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=aswa
      - POSTGRES_PASSWORD=aswa
      - POSTGRES_DB=aswa_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aswa"]
      interval: 2s
      timeout: 2s
      retries: 5
    networks:
      - aswa-test-network

  # Test Redis
  redis-test:
    image: redis:7
    ports:
      - "6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 5
    networks:
      - aswa-test-network

  # Test Elasticsearch
  elasticsearch-test:
    image: elasticsearch:8.11.0
    ports:
      - "9201:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    tmpfs:
      - /usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aswa-test-network

  # Test MinIO
  minio-test:
    image: minio/minio
    ports:
      - "9002:9000"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    tmpfs:
      - /data
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 5
    networks:
      - aswa-test-network

networks:
  aswa-test-network:
    driver: bridge
